# Builds, tests and publishes a signed APK to a GitHub release when a version tag (v<versionName>) is pushed.
# Needs the KEYSTORE_BASE64 repository secret: the base64 of signing/task-alarm-debug.keystore (see AGENTS.md).
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.0.0"

      - name: Check the tag matches the app version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 repository secret (Settings > Secrets and variables > Actions)."; exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/task-alarm-debug.keystore

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain --max-workers=2

      - name: Verify the APK is signed with the dedicated key
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -q b35e88b56a77b669fb891a39f8f8eba64e52166eeef1a3d0087e81090f8b1014 \
            || { echo "::error::APK is not signed with the Task Alarm debug key; refusing to publish."; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk "task-alarm-$VERSION.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: Task Alarm ${{ env.VERSION }}
          files: task-alarm-${{ env.VERSION }}.apk
          generate_release_notes: true
          body: |
            Download `task-alarm-${{ env.VERSION }}.apk` below and open it on your phone to install or update.
            It is signed with the same key as earlier 0.4+ builds, so it installs over them and keeps your alarms.

            Features are described in the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md);
            on-device checks are listed in `docs/device-testing.md`.
